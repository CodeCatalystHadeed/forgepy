[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgepy"
version = "1.0.0"
description = "A safe, extensible project generator for modern Python applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ForgePy contributors"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
keywords = ["scaffolding", "project-generator", "fastapi", "rag", "langgraph"]
dependencies = [
  "questionary>=2.0,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/CodeCatalystHadeed/forgepy"
Repository = "https://github.com/CodeCatalystHadeed/forgepy"
Issues = "https://github.com/CodeCatalystHadeed/forgepy/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
forgepy = "forgepy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgepy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
