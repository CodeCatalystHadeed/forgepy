name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=forgepy --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
          python scripts/validate_dist.py dist/*
      - name: Smoke-test wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import forgepy"
          "$RUNNER_TEMP/wheel-env/bin/forgepy" --help
          "$RUNNER_TEMP/wheel-env/bin/forgepy" --version
          for template in fastapi rag agent langgraph ml data-science cli; do
            "$RUNNER_TEMP/wheel-env/bin/forgepy" create "wheel-$template" --template "$template" --guidance learning --no-interactive
            "$RUNNER_TEMP/wheel-env/bin/python" -m compileall -q "wheel-$template"
          done
      - name: Smoke-test sdist in isolation
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/python" -c "import forgepy"
          "$RUNNER_TEMP/sdist-env/bin/forgepy" --help
          "$RUNNER_TEMP/sdist-env/bin/forgepy" --version
          for template in fastapi rag agent langgraph ml data-science cli; do
            "$RUNNER_TEMP/sdist-env/bin/forgepy" create "sdist-$template" --template "$template" --guidance minimal --no-interactive
            "$RUNNER_TEMP/sdist-env/bin/python" -m compileall -q "sdist-$template"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
